apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudshift-web
  namespace: cloudshift

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudshift-web

  minReplicas: 3
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300

    scaleUp:
      stabilizationWindowSeconds: 0
